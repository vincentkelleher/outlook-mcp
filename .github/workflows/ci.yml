name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: end-to-end against the built entry
        run: npm run test:e2e
        env:
          OUTLOOK_E2E_BIN: dist/index.js
      - name: the built entry offers the documented commands
        run: |
          node dist/index.js --help | grep -q 'config \[options\] <client>'
          node dist/index.js --help | grep -q 'emails'
          node dist/index.js config generic

  pack:
    name: Release artefact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub's auto-generated source archives contain no build output and
      # `prepare` does not run for a tarball install, so what a person installs is
      # `npm pack` output and nothing else. Assert that it is; the release itself
      # carries no archive (the image is the distribution), so the tarball is kept
      # only to be looked at.
      - name: pack and inspect the tarball
        run: |
          set -euo pipefail
          tarball=$(npm pack | tail -1)
          echo "packed $tarball"
          # One listing, captured; then grep the text. Piping tar into
          # `grep -q` would close the pipe on the first match, GNU tar would
          # die on the broken pipe, and pipefail would report that instead of
          # the check — as it did on every CI run of this step.
          listing=$(tar -tzf "$tarball")
          grep -q '^package/dist/index\.js$' <<<"$listing"
          # README links to the client matrix, so a tarball without it ships a
          # promise it cannot keep; the plan is a historical record and stays out.
          grep -q '^package/skills/outlook-mcp/SKILL\.md$' <<<"$listing"
          grep -q '^package/docs/clients\.md$' <<<"$listing"
          # A negated command is the one thing `set -e` is documented to ignore:
          # bash skips errexit for any command whose status it inverts with `!`. So
          # the check has to say what it found and leave — as it stood, the plan
          # could be in the tarball and the job would still be green, on every
          # shell from 5.1 up.
          if grep -q 'plan-mcp-skill' <<<"$listing"; then
            echo "the migration plan is in the tarball" >&2
            exit 1
          fi
          # fd 0 is the pipe, so there is nothing to plumb: no buffer, no event
          # handlers, and no `require` in a repository whose package.json is a
          # module. Checked on the Node this job runs and the one before it.
          tar -xzf "$tarball" -O package/package.json | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync(0, "utf8"));
            if (!manifest.name || !manifest.version)
              throw new Error("the packed package.json needs name and version");
            if (manifest.bin && !manifest.bin["outlook-mcp"])
              throw new Error("the packed bin does not point at dist/index.js");
            console.log(manifest.name, manifest.version, manifest.bin["outlook-mcp"]);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: outlook-mcp-tarball
          path: outlook-mcp-*.tgz
          if-no-files-found: error
          # Nothing downstream reads it; a week is long enough to notice a bad
          # release and answer the question of what was actually in it.
          retention-days: 7
