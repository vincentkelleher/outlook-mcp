name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: end-to-end against the built entry
        run: npm run test:e2e
        env:
          OUTLOOK_E2E_BIN: dist/index.js
      - name: the built entry offers the documented commands
        run: |
          node dist/index.js --help | grep -q 'config \[options\] <client>'
          node dist/index.js --help | grep -q 'emails'
          node dist/index.js config generic

  pack:
    name: Release artefact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub's auto-generated source archives contain no build output and
      # `prepare` does not run for a tarball install, so the artefact attached to
      # a release must be `npm pack` output. Assert that it is.
      - name: pack and inspect the tarball
        run: |
          set -euo pipefail
          tarball=$(npm pack | tail -1)
          echo "packed $tarball"
          tar -tzf "$tarball" | grep -q '^package/dist/index\.js$'
          tar -tzf "$tarball" | grep -q '^package/skills/outlook-mcp/SKILL\.md$'
          # README links to the client matrix, so a tarball without it ships a
          # promise it cannot keep; the plan is a historical record and stays out.
          tar -tzf "$tarball" | grep -q '^package/docs/clients\.md$'
          ! tar -tzf "$tarball" | grep -q 'plan-mcp-skill'
          tar -xzf "$tarball" -O package/package.json | node -e '
            let text = "";
            process.stdin.on("data", (chunk) => (text += chunk));
            process.stdin.on("end", () => {
              const manifest = JSON.parse(text);
              if (!manifest.name || !manifest.version)
                throw new Error("the packed package.json needs name and version");
              if (manifest.bin && !manifest.bin["outlook-mcp"])
                throw new Error("the packed bin does not point at dist/index.js");
              console.log(manifest.name, manifest.version, manifest.bin["outlook-mcp"]);
            });
          '
      - uses: actions/upload-artifact@v4
        with:
          name: outlook-mcp-tarball
          path: outlook-mcp-*.tgz
          if-no-files-found: error
