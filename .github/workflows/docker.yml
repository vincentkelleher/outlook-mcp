name: Docker

# The image is published from tags, built on every push to the default branch,
# and built and smoke-tested on every pull request, so a pull request that breaks
# the container is found there and not in a release.
#
# A release arrives here as the completion of `release.yml`, not as a tag push:
# semantic-release pushes `v0.2.0` with `GITHUB_TOKEN`, and a ref pushed with that
# token starts no workflow run at all. So `gate` asks the Release run which
# version it cut, and the image is named from the answer. That release is itself
# the completion of CI, so the chain reads CI → Release → Docker.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  # `gate` lists and downloads the artefact of the run that triggered this one.
  actions: read

env:
  # Lower case, as GHCR requires: `github.repository` already is for this repo,
  # and the name here is the one the client snippets print.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  gate:
    name: What to publish
    runs-on: ubuntu-latest
    outputs:
      # The ref to build: empty for every event but a release, where it is the
      # tag `release.yml` created and no trigger of ours can see.
      ref: ${{ steps.decide.outputs.ref }}
      # The same version without the `v`, which is the shape an image tag wants.
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      # The documented way to read another run's artefact: the run id out of the
      # event, and a token to ask with. Only a run that passed can have answered —
      # a skipped one never reached the step that writes the answer, and
      # `download-artifact` fails on a named artefact that is not there instead of
      # quietly reporting nothing.
      - name: What the Release run decided
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          name: released-version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: released

      - name: What this run should publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          # A pull request has no reason to write to the registry, and no right to.
          if [ "$EVENT" = pull_request ]; then exit 0; fi

          # A push to main, a tag, a manual run: publish the ref it pushed, and let
          # `docker/metadata-action` name it from that ref.
          if [ "$EVENT" != workflow_run ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A Release run that was skipped — CI red, or main overtaken — never got
          # to answer, and one that cut no version answers `none`. Either way there
          # is nothing new here, and `publish` stays unset.
          if [ "$CONCLUSION" != success ]; then
            echo "The Release run ended '${CONCLUSION:-nothing}', so there is nothing to publish."
            exit 0
          fi

          # The tag is invisible to this trigger — semantic-release pushed it with
          # the workflow token — so the version comes from the answer the Release run
          # left behind, and the ref is spelled back out of it. An answer that is
          # not here at all fails this step, which is where it belongs: the version
          # is unknown, not merely absent.
          version=$(tr -d '[:space:]' < released/released-version)
          if [ "$version" = none ]; then
            echo "The Release run cut no version, so there is nothing new to publish."
            exit 0
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish a version that is not vX.Y.Z: '$version'" >&2
            exit 1
          fi
          {
            echo "ref=$version"
            echo "version=${version#v}"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
          echo "Released $version: its image goes next."

  smoke:
    name: Build and run it
    needs: gate
    runs-on: ubuntu-latest
    steps:
      # The same source the image is published from: a release tests the tag, not
      # whatever the default branch happens to be by the time this runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: docker/setup-buildx-action@v3

      # One architecture, loaded into the runner's Docker, because the steps
      # below run the image rather than read it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: outlook-mcp:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=min,scope=smoke

      - name: It serves, and says so
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -p 127.0.0.1:3939:3939 \
            -v outlook-mcp-smoke:/data \
            -e OUTLOOK_OAUTH_CLIENT_ID=00000000-0000-0000-0000-000000000000 \
            outlook-mcp:smoke
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3939/health > body.json; then break; fi
            sleep 1
          done
          docker logs smoke
          cat body.json
          grep -q '"status":"ok"' body.json
          grep -q '"readonly":false' body.json
          # The banner is logged on stderr, so the pipe must carry it, and grep
          # must read to EOF: with `grep -q` the pipe closes on the match, the
          # docker CLI dies writing the rest, and pipefail reports that instead
          # of the grep that matched.
          docker logs smoke 2>&1 | grep 'Outlook MCP serving on http://127.0.0.1:3939/mcp' > /dev/null

      - name: A name that is not this machine's is refused
        # The DNS rebinding rule, checked against the real container behind a
        # real published port: without it, any page a person visits could talk
        # to their own mailbox on 127.0.0.1.
        run: |
          set -uo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: evil.example:3939' http://127.0.0.1:3939/health)
          echo "Host: evil.example answered $code"
          test "$code" = "403"
          origin=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Origin: http://evil.example' http://127.0.0.1:3939/health)
          echo "Origin: http://evil.example answered $origin"
          test "$origin" = "403"

      - name: The CLI in the image is the CLI in the README
        run: |
          set -euo pipefail
          docker run --rm outlook-mcp:smoke --help 2>&1 | grep 'serve \[options\]' > /dev/null
          # `docker exec` starts a program, not the entrypoint, so this is the
          # form the README gives. As above: read the pipe to EOF, do not let
          # `grep -q` close it under the writer.
          docker exec smoke outlook config docker 2>&1 | grep '127.0.0.1:3939/mcp' > /dev/null
          # A `.env` in the layer would configure every container built from it,
          # because the entry reads one from its working directory.
          docker run --rm --entrypoint sh outlook-mcp:smoke -c 'test ! -e /app/.env'
          # And it ships no session: /data holds nothing but the attachments
          # directory the image creates, so anything else — a token, a config —
          # would be built into the volume. `ls -A /data` alone would always
          # report the attachments directory itself.
          test -z "$(docker run --rm --entrypoint sh outlook-mcp:smoke -c 'find /data -mindepth 1 ! -path /data/attachments ! -path "/data/attachments/*"')"

      - name: Why it died
        if: failure()
        run: |
          docker ps -a
          docker logs smoke || true

  image:
    name: Publish
    needs: [gate, smoke]
    # A pull request has no reason to write to the registry and no right to it,
    # and a Release run that cut no version has nothing new to put there.
    if: needs.smoke.result == 'success' && needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-,enable=${{ needs.gate.outputs.version == '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            # A release is the completion of another workflow, so the event is
            # neither a tag push nor a push to the default branch: `type=semver`
            # has no tag of its own to read and `{{is_default_branch}}` is false.
            # Name the tags from the version the Release run reported, so that
            # `latest` follows a release rather than the commit main was at
            # before the version commit landed on it.
            type=semver,pattern={{version}},value=v${{ needs.gate.outputs.version }},enable=${{ needs.gate.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.gate.outputs.version }},enable=${{ needs.gate.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.gate.outputs.version != '' }}

      - name: Build and push both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=min,scope=smoke
          annotations: ${{ steps.meta.outputs.annotations }}
